# Your tiered watchlist.
#
# target_price   = moomoo App "平均目标价" (analyst average target price)
# fair_value     = moomoo App "公允价值" (fair value estimate)
# target_price_prev / fair_value_prev = previous values, kept for reference
#   whenever a refresh updates a number (so you can see the delta).
# fundamentals_updated = date these two numbers were last refreshed
# fundamentals_source  = where the numbers came from. "moomoo (user CSV export)"
#   means you pasted/uploaded the exact numbers from your moomoo App -- these
#   are authoritative. "web search estimate" (legacy) was a best-effort proxy
#   used before you started sharing moomoo's own export and is no longer used.
#
# is_etf stocks (e.g. IGV) have no analyst target/fair value -- MA-tier alerts
# still apply, fair-value tracking is skipped.
#
# sell_targets (optional, per stock): price levels to sell INTO -- the mirror
# of the buy ladder, firing when price rises to or above the level. Like
# custom_targets they never reset on a period boundary: a sell is a one-off
# decision about a position, not a recurring rule. `action` is your own
# wording and is shown verbatim, not interpreted -- nothing sizes or places
# an order. Format:
#   sell_targets:
#     - level: 540
#       action: "sell half"
#
# custom_targets (optional, per stock): your own manually-set buy levels,
# layered on top of the MA ladder with independent, always-on priority --
# they do NOT reset each period/month like the MA rungs do, and stay active
# until you remove or edit the entry. Format:
# ladder (optional, per stock): overrides for how this stock's MA ladder is
# built -- your per-stock judgment, layered on the global rules.yaml numbers.
# See README "Your standing ladder preferences". Format:
#   ladder:
#     drop_step_pct: 7.0   # widen this stock's synthetic step (default 5%).
#                          # Rung choice still takes whichever is LOWER of the
#                          # next real MA support and the drop level, so an MA
#                          # deeper than the 7% level still wins.
#     start_ma: 250        # anchor the ladder at this MA and ignore every
#                          # shallower one ("start with ma250 directly")
#     skip_top_rungs: 2    # or: build as usual, then discard the N shallowest
#                          # rungs. Multipliers restart at x1 on whatever
#                          # survives, so the ladder still steps x1/x1.5/x2.
# Changing any of these rebuilds that stock's ladder on the next run_check.py
# run, without waiting for its period to roll over.
#
#   custom_targets:
#     - level: 65          # trigger price
#       amount: 900         # optional; defaults to the tier's base_amount
#       note: "wait for capitulation"   # optional, shown on the dashboard
#       added: "2026-08-22"             # optional, informational only


# Your tiered watchlist.
#
# target_price   = Morningstar "analyst rating average" price target
# fair_value     = Morningstar fair value estimate
# target_price_prev / fair_value_prev = previous values, kept for reference
#   whenever the weekly refresh updates a number (so you can see the delta).
# fundamentals_updated = date these two numbers were last refreshed
# fundamentals_source  = where the weekly refresh found them (best-effort web
#   search -- Morningstar's own figure is paywalled, so this is a proxy and
#   worth spot-checking against the app periodically)
#
# is_etf stocks (e.g. IGV) have no analyst target/fair value -- MA-tier alerts
# still apply, fair-value tracking is skipped.


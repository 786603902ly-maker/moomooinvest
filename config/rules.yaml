# Investment rule engine configuration
#
# How the ladder works (see README.md for full explanation):
#  - Each tier has a set of MA (moving average) periods to watch.
#  - Once per "period" (weekly for T1, biweekly for T2, monthly for T3+),
#    the current value of each MA in the tier's set is looked up. MAs within
#    cluster_merge_pct of each other are treated as ONE support level (their
#    average) -- e.g. MA60 and MA100 sitting 1% apart isn't two separate buy
#    points, it's the market agreeing on one support.
#  - Rung 1 = the highest support level, multiplier x1. Each further rung is
#    whichever is LOWER of (a) the next real support level below the prior
#    rung, or (b) the prior rung minus drop_step_pct -- so a rung is only
#    ever a real MA support when that support is already at least
#    drop_step_pct further down; otherwise it's a plain drop_step_pct step.
#    This guarantees every rung is a genuine deeper support, never a near-
#    duplicate of the one above it. Multipliers step x1 -> x1.5 -> x2 (cap)
#    across however many rungs this produces.
#  - If price falls through the lowest rung of the ladder, further trigger
#    points are generated every drop_step_pct below that, capped at
#    cap_multiplier (rule 3).
#  - Within a period, each rung can fire at most once. A new period resets
#    all rungs so the same level can fire again (rule 4).
#
# ASSUMPTIONS THAT STILL NEED YOUR CONFIRMATION (see README "Please confirm"
# section): the exact ma_ladder for T3 / T3.5 / T5, and base_amount for every
# tier except T1 (only T1's 600 SGD was given explicitly).

currency: SGD
cap_multiplier: 2.0
drop_step_pct: 5.0
cluster_merge_pct: 3.0
step_multipliers: [1.0, 1.5, 2.0]

tiers:
  T1:
    base_amount: 600
    refresh: weekly
    ma_ladder: [60, 100, 150]
  T2:
    base_amount: 600
    refresh: biweekly
    ma_ladder: [100, 150, 200]
  T3:
    base_amount: 600
    refresh: monthly
    ma_ladder: [150, 200, 250]
  T3.5:
    base_amount: 600
    refresh: monthly
    ma_ladder: [200, 250]
  T5:
    base_amount: 600
    refresh: monthly
    ma_ladder: [250]
  T9:
    base_amount: 600
    refresh: monthly
    ma_ladder: [250]

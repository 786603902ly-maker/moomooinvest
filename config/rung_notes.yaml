# Your own annotations on specific ladder rungs (target price reasoning,
# conviction, "wait for X to confirm", etc.) -- purely informational, shown
# on the dashboard next to that rung. They do NOT change trigger behavior;
# if a note implies an actual price you want alerts on, tell Claude in chat
# and it'll set up a proper custom_targets entry in stocks.yaml instead
# (see README "Custom targets").
#
# You can type notes directly in the dashboard (they sync across devices via
# api/notes.js). This file is the seed copy baked into dashboard/index.html
# at build time, and the authoritative record Claude sessions read.
#
# Format: ticker -> { rung_id: "note text" }. rung_id is shown in small
# print under each note input on the dashboard (e.g. "ma-60+100",
# "rung-drop-2") -- or just tell Claude in plain English which stock/rung
# you mean and let it fill in the id.
#
# NOTE ON KEY DRIFT: a rung id changes when the ladder's shape changes.
#  - Order inside a cluster id ("ma-200+100" vs "ma-100+200") flips whenever
#    the MAs cross. build_dashboard.py normalizes that, so those keys keep
#    matching on their own.
#  - Cluster *membership* changing (MA100 drifting within 3% of MA200 turns
#    two rungs "ma-200"/"ma-100" into one "ma-200+100") is a genuinely
#    different rung id and is NOT auto-remapped. build_dashboard.py prints a
#    "note key matches no rung" warning to stderr when that happens; re-point
#    the key here when you see one. Three keys were re-pointed by hand on
#    2026-09-20 for exactly this reason (MSFT ma-200 -> ma-200+100, plus
#    IGV/PLTR cluster-order flips).
#
# Source of the current set: your dashboard note export of 2026-09-20,
# transcribed verbatim. The reasoning behind the recurring "use 7% drop
# instead" notes is written up in README -> "Your standing ladder
# preferences" and CLAUDE.md; the short version is: in a clear downtrend at
# an already-low price you'd rather step down 7% than the engine's default
# 5%, provided that 7% step is still above (i.e. doesn't skip past) the next
# real MA support.

notes:
  AVGO:
    ma-100: "price dropped far lower than this, and all ma quite close, would rather skip this and go next lower ma"
    rung-drop-1: "price dropped far lower than this, and all ma quite close, would rather skip this and go next lower ma"
    rung-drop-2: "ok to keep this one, and next one i will choose will be your below one 341.65"

  NVDA:
    ma-100+60: "ok to keep"
    rung-drop-1: "ok"
    rung-drop-2: "ok"

  TSM:
    ma-60+100: "all ma quite close, would rather go 392.52 directly"
    rung-drop-2: "ok to keep as next tier after 392.52"

  IGV:
    # exported as "ma-200+100"; same cluster, MA100/MA200 have since crossed
    ma-100+200: "ok"
    rung-drop-1: "use 7% drop instead"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  META:
    ma-200+150+100: "ok"
    rung-drop-1: "use 7% drop instead"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  MSFT:
    # exported as "ma-200"; MA100 has since merged into that same support
    ma-200+100: "ok"
    rung-drop-1: "use 7% drop instead"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  PLTR:
    # exported as "ma-150+100"; same cluster, MA100/MA150 have since crossed
    ma-100+150: "use 7% drop instead"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  AMD:
    ma-150: "ok"
    ma-200: "use 7% drop instead to reduce avg cost"
    ma-250: "use another 7% drop instead to reduce avg cost"

  AMZN:
    ma-150+200+250: "ok"
    rung-drop-1: "use 7% drop instead"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  GOOG:
    ma-150+200: "ok"
    ma-250: "use 7% drop instead to reduce avg cost"
    rung-drop-2: "use another 7% drop instead to reduce avg cost"

  RKLB:
    ma-150: "price dropped far lower than this, and all ma quite close, would rather skip this, higher chance to buy with low price, so start with ma250 directly"
    ma-200: "drop 7% on top of ma250"
    ma-250: "drop 7% on top of ma250"

  FTNT:
    rung-drop-1: "drop 7%"
    rung-drop-2: "another 7% drop"

  LRCX:
    rung-drop-2: "drop 7%"

  NBIS:
    ma-250: "drop 7%"
    rung-drop-2: "drop 7%"

  XLV:
    rung-drop-1: "ok since etf expects less drop ratio"

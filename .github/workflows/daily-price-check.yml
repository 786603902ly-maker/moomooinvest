name: Daily price check

# Runs once after US market close (21:30 UTC ~= 05:30 SGT next day) every day.
# Weekends/holidays are harmless no-ops (the fetch just returns the same last
# trading day, so nothing changes and no commit is made). This job only
# refreshes price/MA/threshold data in data/state.json; it does not touch
# the Morningstar target price / fair value numbers (see the weekly Claude
# routine for that). It does rebuild dashboard/index.html, so the page Vercel
# serves matches the state this run just wrote -- before that step existed the
# HTML sat on its previous build until some later market-open run happened to
# rebuild it, which made the live site lag the data by a day or more.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run rule engine
        working-directory: scripts
        run: python3 run_check.py

      - name: Rebuild dashboard
        working-directory: scripts
        run: python3 build_dashboard.py

      # The tick store (which rungs you actually bought) lives in Vercel KV,
      # not in git, so a Claude session cloning this repo cannot see your buy
      # history. Archiving it here puts it in git where every session reads it.
      #
      # GATED ON VISIBILITY ON PURPOSE. Buy history is private; committing it
      # to a public repository publishes it permanently, and git history keeps
      # it even if the file is deleted later. This step therefore checks the
      # repository's actual visibility through the API on every run and does
      # nothing while it is public. Flip the repo to private and it starts
      # working by itself -- no code change, and no window where the data
      # leaks because someone forgot the order of operations.
      - name: Archive tick history (private repositories only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: https://moomooinvest.vercel.app
        run: |
          visibility=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | python3 -c "import json,sys; print('private' if json.load(sys.stdin).get('private') else 'public')")
          if [ "$visibility" != "private" ]; then
            echo "::notice::Repository is public -- not archiving tick history. Make the repo private (Settings -> General -> Change visibility) and this starts on the next run."
            exit 0
          fi
          code=$(curl -sS -o /tmp/ticks.json -w '%{http_code}' --max-time 30 "$SITE/api/ticks")
          if [ "$code" != "200" ]; then
            echo "::warning::/api/ticks returned HTTP $code -- keeping the previous data/ticks.json"
            exit 0
          fi
          python3 - <<'PY'
          import json
          ticks = json.load(open("/tmp/ticks.json"))
          if not isinstance(ticks, dict) or "error" in ticks:
              raise SystemExit("::warning::unexpected /api/ticks payload -- not overwriting")
          with open("data/ticks.json", "w") as fh:
              json.dump(ticks, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(f"Archived {len(ticks)} tick(s) to data/ticks.json")
          PY

      - name: Commit updated state
        run: |
          git config user.name "moomooinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/prices dashboard/index.html
          git add data/ticks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily price/threshold refresh"
            git push
          fi

name: Daily price check

# Runs once after US market close (21:30 UTC ~= 05:30 SGT next day) every day.
# Weekends/holidays are harmless no-ops (the fetch just returns the same last
# trading day, so nothing changes and no commit is made). This job only
# refreshes price/MA/threshold data in data/state.json; it does not touch
# the Morningstar target price / fair value numbers (see the weekly Claude
# routine for that) and does not publish the dashboard (also handled by the
# Claude routines, which have Artifact + WebSearch access this job doesn't).
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run rule engine
        working-directory: scripts
        run: python3 run_check.py

      - name: Commit updated state
        run: |
          git config user.name "moomooinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/prices
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily price/threshold refresh"
            git push
          fi
